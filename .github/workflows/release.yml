name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Run checks
        run: pnpm check

      - name: Build macOS DMG
        run: pnpm dist:mac

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd release
          shasum -a 256 \
            Clean-My-Agent-mac-arm64.dmg \
            Clean-My-Agent-mac-arm64.dmg.blockmap \
            latest-mac.yml > checksums.txt

      - name: Generate changelog
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${GITHUB_SHA}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
          else
            range="${GITHUB_SHA}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi

          changelog="$(git log --no-merges --pretty=format:'- %s (%h)' "${range}")"
          if [ -z "${changelog}" ]; then
            changelog="- Maintenance release (${GITHUB_SHA::7})"
          fi

          {
            echo "Automated macOS Apple Silicon release."
            echo
            echo "## Changes"
            echo
            echo "${changelog}"
            echo
            echo
            echo "Full changelog: ${compare_url}"
            echo
            echo "## Artifacts"
            echo
            echo "- Clean-My-Agent-mac-arm64.dmg"
            echo "- Clean-My-Agent-mac-arm64.dmg.blockmap"
            echo "- latest-mac.yml"
            echo "- checksums.txt"
            echo
            echo "This build is ad-hoc signed and not notarized yet. macOS may require right-click > Open"
            echo "or allowing the app from System Settings > Privacy & Security on first launch."
          } > release-notes.md

          test -s release-notes.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-my-agent-${{ github.ref_name }}-mac-arm64
          path: |
            release/Clean-My-Agent-mac-arm64.dmg
            release/Clean-My-Agent-mac-arm64.dmg.blockmap
            release/latest-mac.yml
            release/checksums.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/Clean-My-Agent-mac-arm64.dmg \
            release/Clean-My-Agent-mac-arm64.dmg.blockmap \
            release/latest-mac.yml \
            release/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Clean My Agent ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
