name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Run checks
        run: pnpm check

      - name: Build macOS DMG
        run: pnpm dist:mac

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd release
          shasum -a 256 \
            Clean-My-Agent-mac-arm64.dmg \
            Clean-My-Agent-mac-arm64.dmg.blockmap \
            latest-mac.yml > checksums.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          Automated macOS Apple Silicon release.

          This build is ad-hoc signed and not notarized yet. macOS may require
          right-click > Open or allowing the app from System Settings > Privacy
          & Security on first launch.
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/Clean-My-Agent-mac-arm64.dmg \
            release/Clean-My-Agent-mac-arm64.dmg.blockmap \
            release/latest-mac.yml \
            release/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Clean My Agent ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
