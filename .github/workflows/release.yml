name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Run checks
        run: pnpm check

      - name: Build macOS DMG
        run: pnpm dist:mac

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd release
          shasum -a 256 \
            Clean-My-Agent-mac-arm64.dmg \
            Clean-My-Agent-mac-arm64.dmg.blockmap \
            latest-mac.yml > checksums.txt

      - name: Generate changelog
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${GITHUB_SHA}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
          else
            range="${GITHUB_SHA}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi

          changelog="$(git log --no-merges --pretty=format:'- %s (%h)' "${range}")"
          if [ -z "${changelog}" ]; then
            changelog="- Maintenance release (${GITHUB_SHA::7})"
          fi

          {
            echo "Automated macOS Apple Silicon release."
            echo
            echo "## Changes"
            echo
            echo "${changelog}"
            echo
            echo
            echo "Full changelog: ${compare_url}"
            echo
            echo "## Artifacts"
            echo
            echo "- Clean-My-Agent-mac-arm64.dmg"
            echo "- Clean-My-Agent-mac-arm64.dmg.blockmap"
            echo "- latest-mac.yml"
            echo "- checksums.txt"
            echo
            echo "This build is ad-hoc signed and not notarized yet. macOS may require right-click > Open"
            echo "or allowing the app from System Settings > Privacy & Security on first launch."
          } > release-notes.md

          test -s release-notes.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-my-agent-${{ github.ref_name }}-mac-arm64
          path: |
            release/Clean-My-Agent-mac-arm64.dmg
            release/Clean-My-Agent-mac-arm64.dmg.blockmap
            release/latest-mac.yml
            release/checksums.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/Clean-My-Agent-mac-arm64.dmg \
            release/Clean-My-Agent-mac-arm64.dmg.blockmap \
            release/latest-mac.yml \
            release/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Clean My Agent ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Update Homebrew cask tap
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          dmg_sha256="$(shasum -a 256 release/Clean-My-Agent-mac-arm64.dmg | awk '{print $1}')"
          release_branch="${RELEASE_BRANCH:-main}"

          git fetch origin "${release_branch}"
          git switch --force-create "${release_branch}" "origin/${release_branch}"

          export CASK_VERSION="${version}"
          export CASK_SHA256="${dmg_sha256}"
          perl -0pi -e 's/^  version ".*"$/  version "$ENV{CASK_VERSION}"/m' Casks/clean-my-agent.rb
          perl -0pi -e 's/^  sha256 ".*"$/  sha256 "$ENV{CASK_SHA256}"/m' Casks/clean-my-agent.rb

          if git diff --quiet -- Casks/clean-my-agent.rb; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/clean-my-agent.rb
          git commit -m "Update Homebrew cask for ${GITHUB_REF_NAME}"

          if git push origin "HEAD:${release_branch}"; then
            echo "Updated Homebrew cask on ${release_branch}."
            exit 0
          fi

          update_branch="automation/homebrew-cask-${GITHUB_REF_NAME}"
          git push --force-with-lease origin "HEAD:${update_branch}"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${release_branch}" \
            --head "${update_branch}" \
            --title "Update Homebrew cask for ${GITHUB_REF_NAME}" \
            --body "Updates the Clean My Agent Homebrew cask to ${GITHUB_REF_NAME} after the release workflow published the macOS DMG."
